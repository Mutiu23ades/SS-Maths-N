<div class="card">
<h2>Topic 66: Ratio, Proportion and Rates</h2>

<h3>Learning Objectives</h3>
<p>By the end of this lesson, students should be able to:</p>
<ul>
<li>Define ratio and express quantities in ratio form.</li>
<li>Simplify ratios.</li>
<li>Divide quantities in a given ratio.</li>
<li>Solve problems involving proportion.</li>
<li>Distinguish between direct and inverse proportion.</li>
<li>Solve problems involving rates.</li>
<li>Apply ratios and rates to real-life situations.</li>
</ul>

<h3>1. Meaning of Ratio</h3>
<p>
A ratio is a comparison of two or more quantities of the same kind.
It tells us how many times one quantity contains another.
</p>

<div class="formula">
Ratio of a to b = a : b = a/b
</div>

<p>The quantities being compared must normally be expressed in the same units.</p>

<div class="example">
<b>Example 1:</b> Express 20 boys to 30 girls as a ratio in its simplest form.
<br><br>
20 : 30
<br>
Divide both terms by 10:
<br>
= 2 : 3
<div class="answer"><b>Answer: 2 : 3</b></div>
</div>

<h3>2. Ratios Involving Units</h3>
<p>Before simplifying a ratio, convert the quantities to the same unit.</p>

<div class="example">
<b>Example 2:</b> Find the ratio of 2 m to 50 cm.
<br><br>
2 m = 200 cm
<br>
Therefore:
<br>
200 : 50 = 4 : 1
<div class="answer"><b>Answer: 4 : 1</b></div>
</div>

<h3>3. Dividing a Quantity in a Given Ratio</h3>

<p>
To divide a quantity in the ratio a:b:
</p>
<ol>
<li>Add the ratio parts.</li>
<li>Divide the total quantity by the sum of the parts.</li>
<li>Multiply by each ratio part.</li>
</ol>

<div class="example">
<b>Example 3:</b> Divide ₦72,000 between Tunde and Musa in the ratio 5:3.
<br><br>
Total parts = 5 + 3 = 8
<br>
Value of one part = 72,000 ÷ 8 = ₦9,000
<br>
Tunde = 5 × 9,000 = ₦45,000
<br>
Musa = 3 × 9,000 = ₦27,000
<div class="answer"><b>Answer: ₦45,000 and ₦27,000</b></div>
</div>

<h3>4. Proportion</h3>
<p>
A proportion is a statement that two ratios are equal.
</p>

<div class="formula">
a : b = c : d  means  a/b = c/d
</div>

<p>Cross multiplication can be used:</p>

<div class="formula">
ad = bc
</div>

<div class="example">
<b>Example 4:</b> If 4 : 7 = x : 21, find x.
<br><br>
4/7 = x/21
<br>
7x = 4 × 21
<br>
7x = 84
<br>
x = 12
<div class="answer"><b>Answer: x = 12</b></div>
</div>

<h3>5. Direct Proportion</h3>
<p>
Two quantities are directly proportional when an increase in one causes a
corresponding increase in the other, or a decrease in one causes a decrease
in the other.
</p>

<div class="formula">
y ∝ x
<br>
Therefore y = kx
</div>

<div class="example">
<b>Example 5:</b> If 5 books cost ₦4,000, how much will 8 books cost?
<br><br>
Cost per book = 4,000 ÷ 5 = ₦800
<br>
Cost of 8 = 8 × 800 = ₦6,400
<div class="answer"><b>Answer: ₦6,400</b></div>
</div>

<h3>6. Inverse Proportion</h3>
<p>
Two quantities are inversely proportional when an increase in one quantity
causes a corresponding decrease in the other.
</p>

<div class="formula">
y ∝ 1/x
<br>
Therefore xy = k
</div>

<div class="example">
<b>Example 6:</b> Six workers complete a job in 12 days. Assuming the rate
of work is the same, how many days will 8 workers take?
<br><br>
Workers × days = constant
<br>
6 × 12 = 8 × x
<br>
72 = 8x
<br>
x = 9
<div class="answer"><b>Answer: 9 days</b></div>
</div>

<h3>7. Rates</h3>
<p>
A rate compares two quantities measured in different units.
Examples include speed, wages per hour, fuel consumption and population
growth per year.
</p>

<div class="formula">
Rate = Quantity ÷ Time
<br><br>
Speed = Distance ÷ Time
</div>

<div class="example">
<b>Example 7:</b> A car travels 240 km in 4 hours. Find its average speed.
<br><br>
Speed = 240 ÷ 4
<br>
= 60 km/h
<div class="answer"><b>Answer: 60 km/h</b></div>
</div>

<h3>Practice Questions</h3>
<ol>
<li>Simplify 36:48.</li>
<li>Express 3 m to 75 cm as a ratio.</li>
<li>Divide ₦90,000 in the ratio 4:5.</li>
<li>If 7:9 = x:45, find x.</li>
<li>If 6 pens cost ₦1,800, find the cost of 15 pens.</li>
<li>Ten workers complete a job in 18 days. How long will 15 workers take?</li>
<li>A vehicle travels 360 km in 5 hours. Find its average speed.</li>
</ol>
</div>

</div>

<br><br>

<br>

<div class="answer"><b>Answer: ₦40,000</b></div>

</div>

<br>

<div class="card">
<h2>Topic 69: Depreciation and Appreciation</h2>

<h3>Learning Objectives</h3>
<ul>

<h3>1. Depreciation</h3>
<p>
Depreciation is the decrease in the value of an asset over time.
Examples include vehicles, machines, computers and equipment.
</p>

<div class="formula">
Depreciation = Original Value − New Value
</div>

<div class="example">
<b>Example 1:</b> A vehicle bought for ₦8,000,000 is now worth ₦6,800,000.

<br><br>
Depreciation = 8,000,000 − 6,800,000
<br>

<div class="answer"><b>Answer: ₦1,200,000</b></div>
</div>

<h3>2. Percentage Depreciation</h3>

<div class="formula">
Percentage depreciation =
Loss in value ÷ Original value × 100%
</div>

<div class="example">
<b>Example 2:</b> A machine falls in value from ₦500,000 to ₦425,000.
Find the percentage depreciation.
<br><br>

<br>

<br>

<div class="answer"><b>Answer: 15%</b></div>

<h3>3. Depreciation by a Fixed Percentage</h3>

<p>

</p>

<div class="formula">
New Value = Original Value × (1 − r/100)
</div>

<div class="example">

<br><br>

<br>
= ₦900,000
<div class="answer"><b>Answer: ₦900,000</b></div>
</div>

<h3>4. Compound Depreciation</h3>

<div class="formula">
V = P(1 − r/100)^n
</div>

<p>Where V is the final value, P is the initial value, r is the annual
depreciation rate and n is the number of years.</p>

<div class="example">
<b>Example 4:</b> A car costs ₦5,000,000 and depreciates at 10% per annum.
Find its value after 3 years.

= 5,000,000 × 0.729
<br>
= ₦3,645,000

<p>

</div>

<div class="card">
<h2>Topic 70: Business Mathematics</h2>

<h3>Learning Objectives</h3>
<ul>
<li>Apply mathematics to business situations.</li>
<li>Calculate revenue, cost and profit.</li>
<li>Understand fixed and variable costs.</li>
<li>Calculate break-even point.</li>
<li>Solve problems involving wages and salaries.</li>
<li>Apply commission and commercial percentages.</li>
</ul>

<h3>1. Revenue</h3>
<p>
Revenue is the total income obtained from selling goods or services.
</p>

<div class="formula">
Revenue = Selling Price × Quantity Sold
</div>

<div class="example">
<b>Example 1:</b> A trader sells 250 bags of rice at ₦75,000 each.
Find the total revenue.
<br><br>
Revenue = 250 × 75,000
<br>
= ₦18,750,000
<div class="answer"><b>Answer: ₦18,750,000</b></div>
</div>

<h3>2. Cost</h3>
<p>
Business costs can include rent, salaries, transportation, raw materials,
electricity and other expenses.
</p>

<p><b>Fixed costs</b> remain unchanged within a given level of activity.</p>
<p><b>Variable costs</b> change according to the level of production or sales.</p>

<div class="formula">
Total Cost = Fixed Cost + Variable Cost
</div>

<div class="example">
<b>Example 2:</b> A business has fixed costs of ₦500,000 and variable costs
of ₦25,000 per unit. Find the total cost of producing 40 units.
<br><br>
Variable cost = 25,000 × 40 = ₦1,000,000
<br>
Total cost = 500,000 + 1,000,000
<br>
= ₦1,500,000
<div class="answer"><b>Answer: ₦1,500,000</b></div>
</div>

<h3>3. Profit</h3>

<div class="formula">
Profit = Total Revenue − Total Cost
</div>

<div class="example">
<b>Example 3:</b> A business has revenue of ₦3,500,000 and total cost of
₦2,800,000. Find its profit.
<br><br>
Profit = 3,500,000 − 2,800,000
<br>
= ₦700,000
<div class="answer"><b>Answer: ₦700,000</b></div>
</div>

<h3>4. Break-Even Point</h3>
<p>
The break-even point is the level of sales at which total revenue equals
total cost. At this point there is neither profit nor loss.
</p>

<div class="formula">
Break-even quantity =
Fixed Cost ÷ (Selling Price per Unit − Variable Cost per Unit)
</div>

<div class="example">
<b>Example 4:</b> A company has fixed costs of ₦600,000. Each item is sold
for ₦10,000 and the variable cost per item is ₦4,000.
Find the break-even quantity.
<br><br>
Break-even quantity =
600,000 ÷ (10,000 − 4,000)
<br>
= 600,000 ÷ 6,000
<br>
= 100 units
<div class="answer"><b>Answer: 100 units</b></div>
</div>

<h3>5. Wages</h3>
<p>
Workers may be paid hourly, daily, weekly or monthly.
</p>

<div class="formula">
Wage = Rate per hour × Number of hours
</div>

<div class="example">
<b>Example 5:</b> A worker earns ₦1,500 per hour and works 40 hours per week.
Find the weekly wage.
<br><br>
Weekly wage = 1,500 × 40
<br>
= ₦60,000
<div class="answer"><b>Answer: ₦60,000</b></div>
</div>

<h3>6. Overtime</h3>
<p>
Overtime is work done beyond the normal working hours and may attract a
higher rate.
</p>

<div class="example">
<b>Example 6:</b> A worker earns ₦1,200 per hour normally and ₦1,800 per
hour for overtime. If he works 40 normal hours and 5 overtime hours,
find his total weekly wage.
<br><br>
Normal pay = 40 × 1,200 = ₦48,000
<br>
Overtime pay = 5 × 1,800 = ₦9,000
<br>
Total = ₦57,000
<div class="answer"><b>Answer: ₦57,000</b></div>
</div>

<h3>7. Business Decision Problems</h3>
<p>
Business mathematics can be used to decide selling prices, production
levels, wages, discounts and expected profits.
</p>

<div class="example">
<b>Example 7:</b> A manufacturer produces 500 units. The fixed cost is
₦400,000 and the variable cost is ₦2,000 per unit. Each unit is sold for
₦3,500. Find the profit.
<br><br>
Variable cost = 500 × 2,000 = ₦1,000,000
<br>
Total cost = 400,000 + 1,000,000 = ₦1,400,000
<br>
Revenue = 500 × 3,500 = ₦1,750,000
<br>
Profit = 1,750,000 − 1,400,000
<br>
= ₦350,000
<div class="answer"><b>Answer: ₦350,000</b></div>
</div>
